<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Snitch — Scan Report</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
  <link rel="stylesheet" href="/static/css/report.css"/>
</head>
<body class="report-body">

  <!-- ── NAV ─────────────────────────────────────────────────────── -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="logo">Snitch<span class="logo-dot">.</span></a>
      <div class="nav-links">
        <span class="report-id-badge" id="report-id-badge">Loading…</span>
        <button class="btn-outline" onclick="downloadJSON()">Export JSON</button>
      </div>
    </div>
  </nav>

  <!-- ── LOADING ──────────────────────────────────────────────────── -->
  <div id="loading-state" class="report-loading">
    <div class="spinner"></div>
    <p>Loading report…</p>
  </div>

  <!-- ── REPORT (hidden until JS populates it) ───────────────────── -->
  <div id="report-content" class="hidden">

    <!-- Header band: source URL + severity scoreboard -->
    <div class="report-header">
      <div class="report-header-inner">
        <div>
          <div class="report-source" id="report-source"></div>
          <div class="report-meta"   id="report-meta"></div>
        </div>
        <div class="severity-scoreboard">
          <div class="score-cell critical">
            <span class="score-num" id="cnt-critical">0</span>
            <span class="score-lbl">Critical</span>
          </div>
          <div class="score-cell high">
            <span class="score-num" id="cnt-high">0</span>
            <span class="score-lbl">High</span>
          </div>
          <div class="score-cell medium">
            <span class="score-num" id="cnt-medium">0</span>
            <span class="score-lbl">Medium</span>
          </div>
          <div class="score-cell low">
            <span class="score-num" id="cnt-low">0</span>
            <span class="score-lbl">Low</span>
          </div>
          <div class="score-cell total">
            <span class="score-num" id="cnt-total">0</span>
            <span class="score-lbl">Total</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard grid: sidebar + main -->
    <div class="report-main">
      <div class="dash-grid">

        <!-- ── SIDEBAR ──────────────────────────────────────────── -->
        <aside class="dash-sidebar">

          <div class="dash-card">
            <div class="dash-card-title">Severity breakdown</div>
            <div class="donut-wrap">
              <canvas id="donut-chart" width="160" height="160"></canvas>
              <div class="donut-legend" id="donut-legend"></div>
            </div>
          </div>

          <div class="dash-card">
            <div class="dash-card-title">By category</div>
            <div id="category-bars"></div>
          </div>

          <div class="dash-card">
            <div class="dash-card-title">Scan stats</div>
            <div class="stat-grid" id="stat-grid"></div>
          </div>

          <div class="dash-card">
            <div class="dash-card-title">Top affected files</div>
            <div id="top-files"></div>
          </div>

        </aside>

        <!-- ── MAIN CONTENT ─────────────────────────────────────── -->
        <div class="dash-main">

          <!-- Filter bar -->
          <div class="filter-bar">
            <div class="filter-inner">
              <button class="filter-btn active" onclick="setFilter('ALL',this)">
                All <span class="filter-count" id="filter-count"></span>
              </button>
              <button class="filter-btn" onclick="setFilter('CRITICAL',this)">Critical</button>
              <button class="filter-btn" onclick="setFilter('HIGH',this)">High</button>
              <button class="filter-btn" onclick="setFilter('MEDIUM',this)">Medium</button>
              <button class="filter-btn" onclick="setFilter('LOW',this)">Low</button>
              <input type="text" id="search-input" class="filter-search"
                     placeholder="Search file, type…"
                     oninput="applyFilters()"/>
            </div>
          </div>

          <!-- No-findings state -->
          <div id="no-findings" class="no-findings hidden">
            <div class="no-findings-icon">✓</div>
            <h2>No secrets found</h2>
            <p>Snitch scanned your codebase and found nothing suspicious. Keep it that way.</p>
          </div>

          <!-- Findings list (populated by report.js) -->
          <div id="findings-list"></div>

        </div><!-- /.dash-main -->
      </div><!-- /.dash-grid -->
    </div><!-- /.report-main -->

  </div><!-- /#report-content -->

  <!-- Inject scan ID from Jinja2 -->
  <script>
    const SCAN_ID = "{{ scan_id }}";

    function downloadJSON() {
      window.open('/api/report/' + SCAN_ID + '/download/json', '_blank');
    }
  </script>
  <script src="/static/js/report.js"></script>
</body>
</html>
